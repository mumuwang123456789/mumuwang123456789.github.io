    <h1>“一箭七星”，发射成功！包含一颗泰国卫星</h1>
<p>光明网 2026‑08‑25<br>科技日报记者 付毅飞 张强</p>
<p>8月25日11时21分，长征六号丙运载火箭在太原卫星发射中心发射升空，将中科卫星14星等7颗卫星顺利送入预定轨道，飞行试验任务取得圆满成功。</p>
<p>长征六号丙运载火箭是中国航天科技集团八院抓总研制的新一代两级液体运载火箭，具备发射多种类型、不同轨道要求卫星的能力，500公里太阳同步轨道运载能力为2.4吨。</p>
