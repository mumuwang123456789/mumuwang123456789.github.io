<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .all{
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }
        .left{
            background-color: red;
            width: 27%;
            height: 100%;
            float: left;
            padding: 20px;
        }
        .right{
            background-color: green;
            width: 70%;
            height: 100%;
            float: right;
            padding: 20px;
        }
        .a{
            background-color: blue;
            width: 30%;
            height: 30%;
            border-radius: 20px;
        }
        .b{
            background-color: rgb(154, 6, 159);
            width: 30%;
            height: 30%;
            border-radius: 20px;
        }
        .c{
            background-color: rgb(214, 233, 5);
            width: 30%;
            height: 30%;
            border-radius: 20px;
        }  
    </style>
</head>
<body>
    <div class="all">

    </div>
    <div class="left">
        <div class="a">

        </div>
        <div class="b">
            
        </div>
        <div class="c">

        </div>  
    </div>
    <div class="right">
        
    </div>
</body>
</html>
